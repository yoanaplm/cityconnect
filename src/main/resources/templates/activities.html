<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activities</title>
</head>
<body>
<h1>Activities near you</h1>
<a th:href="@{/}">Home</a>
<p th:if="${activities.isEmpty()}">No activities near you.</p>
<table th:if="${!activities.isEmpty()}">

    <tr>
        <th>Title</th>
        <th>Starts</th>
        <th>Capacity</th>
    </tr>
    <tr th:each="activity : ${activities}">
        <td th:text="${activity.title}"></td>
        <td th:text="${#temporals.format(activity.startsAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${activity.capacity}"></td>
    </tr>

</table>
</body>
</html>
